<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="col-md-5 mx-auto">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="text-center mb-4">Register</h2>

                <form id="registerForm">

                    <input type="text" id="full_name" class="form-control mb-2" placeholder="Full Name" required>

                    <input type="text" id="username" class="form-control mb-2" placeholder="Username" required>

                    <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>

                    <input type="password" id="password" class="form-control mb-2" placeholder="Password" required>

                    <button class="btn btn-success w-100">
                        Register
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script>

document.getElementById("registerForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const response = await fetch(
        "/api/register/",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                full_name:
                document.getElementById("full_name").value,

                username:
                document.getElementById("username").value,

                email:
                document.getElementById("email").value,

                password:
                document.getElementById("password").value

            })
        }
    );

    if(response.ok){

        alert("Registration Successful");

        window.location.href="/";

    }else{

        alert("Registration Failed");
    }

});

</script>

</body>
</html>
