{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Todo | Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/login.css' %}"
    >

</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="card shadow-lg">

            <div class="card-body">

                <div class="text-center">

                    <div class="logo">
                        ✅
                    </div>

                    <h2>
                        Welcome Back
                    </h2>

                    <p class="subtitle">
                        Login to manage your tasks
                    </p>

                </div>

                <form id="loginForm">

                    <div class="mb-3">

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Email Address"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-login w-100"
                    >
                        Login
                    </button>

                </form>

                <div class="text-center mt-4">

                    <span>
                        Don't have an account?
                    </span>

                    <a
                        href="/register-page/"
                        class="register-link"
                    >
                        Register
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

document.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    const response =
    await fetch(
        "/api/login/",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                email:email,
                password:password

            })
        }
    );

    const data =
    await response.json();

    if(data.access){

        localStorage.setItem(
            "access",
            data.access
        );

        localStorage.setItem(
            "refresh",
            data.refresh
        );

        alert("Login Successful");

        window.location.href =
        "/dashboard-page/";
    }

    else{

        alert(
            "Invalid Email or Password"
        );
    }

});

</script>

</body>

</html>
